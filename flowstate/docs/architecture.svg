<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" width="1240" height="900" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="aInk" markerWidth="9" markerHeight="9" refX="7" refY="4.2" orient="auto"><path d="M0,0 L8,4.2 L0,8.4 Z" fill="#6E6456"/></marker>
    <marker id="aAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.2" orient="auto"><path d="M0,0 L8,4.2 L0,8.4 Z" fill="#B4661E"/></marker>
    <marker id="aTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.2" orient="auto"><path d="M0,0 L8,4.2 L0,8.4 Z" fill="#2C6E6A"/></marker>
    <marker id="aViolet" markerWidth="9" markerHeight="9" refX="7" refY="4.2" orient="auto"><path d="M0,0 L8,4.2 L0,8.4 Z" fill="#6B4E9E"/></marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1240" height="900" fill="#F4F0E7"/>

  <!-- title -->
  <text x="40" y="46" font-size="26" font-weight="700" fill="#241E1A">FlowState — Current Architecture</text>
  <text x="40" y="70" font-size="13" fill="#6E6456">Local, offline context restoration + cross-application day record · Phases 1–10 · every server binds 127.0.0.1</text>

  <!-- legend -->
  <g font-size="11.5" fill="#6E6456">
    <line x1="815" y1="34" x2="843" y2="34" stroke="#B4661E" stroke-width="3"/><text x="850" y="38">restore / synthesis path</text>
    <line x1="815" y1="52" x2="843" y2="52" stroke="#2C6E6A" stroke-width="3"/><text x="850" y="56">capture (sanitized)</text>
    <line x1="1010" y1="34" x2="1038" y2="34" stroke="#6B4E9E" stroke-width="3" stroke-dasharray="5 4"/><text x="1045" y="38">vectors — search only</text>
    <line x1="1010" y1="52" x2="1038" y2="52" stroke="#B4661E" stroke-width="3" stroke-dasharray="6 4"/><text x="1045" y="56">control / opt-in cloud</text>
  </g>

  <!-- privacy boundary -->
  <rect x="30" y="96" width="1040" height="772" rx="18" fill="none" stroke="#C9BEA8" stroke-width="1.5" stroke-dasharray="3 6"/>
  <text x="48" y="120" font-family="Consolas, monospace" font-size="11.5" fill="#9a8f7d">localhost · 127.0.0.1 · sanitized before store · offline after model pull — only the opt-in summary may leave</text>

  <!-- ===================== SURFACES ===================== -->
  <!-- VS Code extension -->
  <rect x="50" y="150" width="300" height="66" rx="10" fill="#DCE9E7" stroke="#2C6E6A"/>
  <text x="200" y="178" text-anchor="middle" font-size="13" font-weight="600" fill="#241E1A">VS Code extension</text>
  <text x="200" y="197" text-anchor="middle" font-size="10.5" fill="#4a5a58">Tier-1 editor capture · rehydrate at cursor</text>
  <!-- Dashboard -->
  <rect x="366" y="150" width="400" height="66" rx="10" fill="#FCFAF4" stroke="#C9BEA8"/>
  <text x="566" y="176" text-anchor="middle" font-size="13" font-weight="600" fill="#241E1A">Dashboard (React / Next)</text>
  <text x="566" y="196" text-anchor="middle" font-size="10.5" fill="#6E6456">Start/End Day · Restore context · live monitoring · report viewer</text>
  <!-- Widget -->
  <rect x="782" y="150" width="260" height="66" rx="10" fill="#FCFAF4" stroke="#C9BEA8"/>
  <text x="912" y="176" text-anchor="middle" font-size="13" font-weight="600" fill="#241E1A">Desktop widget</text>
  <text x="912" y="196" text-anchor="middle" font-size="10.5" fill="#6E6456">last capture · “where you left off”</text>

  <!-- surface <-> daemon arrows -->
  <line x1="150" y1="216" x2="150" y2="250" stroke="#2C6E6A" stroke-width="1.8" marker-end="url(#aTeal)"/>
  <text x="144" y="238" text-anchor="end" font-family="Consolas, monospace" font-size="10" fill="#2C6E6A">POST /snapshot</text>
  <line x1="250" y1="250" x2="250" y2="216" stroke="#B4661E" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aAmber)"/>
  <text x="256" y="238" font-family="Consolas, monospace" font-size="10" fill="#B4661E">/ext/ws</text>
  <line x1="540" y1="216" x2="540" y2="250" stroke="#6E6456" stroke-width="1.6" marker-end="url(#aInk)"/>
  <text x="534" y="238" text-anchor="end" font-family="Consolas, monospace" font-size="10" fill="#6E6456">REST</text>
  <line x1="596" y1="250" x2="596" y2="216" stroke="#6E6456" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#aInk)"/>
  <text x="602" y="238" font-family="Consolas, monospace" font-size="10" fill="#6E6456">/ws</text>
  <line x1="900" y1="216" x2="900" y2="250" stroke="#6E6456" stroke-width="1.6" marker-end="url(#aInk)"/>
  <text x="906" y="238" font-family="Consolas, monospace" font-size="10" fill="#6E6456">REST poll</text>

  <!-- ===================== DAEMON ===================== -->
  <rect x="50" y="250" width="1000" height="362" rx="14" fill="#FBF7EF" stroke="#B4661E" stroke-width="1.6"/>
  <text x="550" y="276" text-anchor="middle" font-size="15" font-weight="700" fill="#241E1A">FastAPI daemon — orchestrator · 127.0.0.1:8420 · event-driven</text>

  <!-- Column A: capture -->
  <text x="66" y="298" font-size="10.5" font-weight="700" fill="#9a8f7d" letter-spacing="0.06em">CAPTURE</text>
  <rect x="66" y="304" width="300" height="52" rx="8" fill="#FCFAF4" stroke="#C9BEA8"/>
  <text x="80" y="325" font-size="12" font-weight="600" fill="#241E1A">Assembler</text>
  <text x="80" y="342" font-size="10" fill="#6E6456">Tier-1 editor + Tier-2 git + Tier-3 ambient</text>
  <rect x="66" y="362" width="300" height="52" rx="8" fill="#FCFAF4" stroke="#C9BEA8"/>
  <text x="80" y="383" font-size="12" font-weight="600" fill="#241E1A">Continuous observer</text>
  <text x="80" y="400" font-size="10" fill="#6E6456">active window + clipboard ~25s → passive</text>
  <rect x="66" y="420" width="300" height="52" rx="8" fill="#FCFAF4" stroke="#C9BEA8"/>
  <text x="80" y="441" font-size="12" font-weight="600" fill="#241E1A">Interruption detector</text>
  <text x="80" y="458" font-size="10" fill="#6E6456">idle · meeting · lock → flag buffer</text>

  <!-- Column B: cross-cutting -->
  <text x="386" y="298" font-size="10.5" font-weight="700" fill="#9a8f7d" letter-spacing="0.06em">GUARDS</text>
  <rect x="386" y="304" width="300" height="64" rx="8" fill="#F0E4D4" stroke="#B4661E"/>
  <text x="400" y="326" font-size="12" font-weight="600" fill="#241E1A">Sanitizer</text>
  <text x="400" y="343" font-size="10" fill="#6E6456">mask emails / keys / tokens / passwords</text>
  <text x="400" y="358" font-size="10" font-weight="600" fill="#B4661E">before store &amp; embed</text>
  <rect x="386" y="376" width="300" height="60" rx="8" fill="#F0E4D4" stroke="#B4661E"/>
  <text x="400" y="398" font-size="12" font-weight="600" fill="#241E1A">CPU governor</text>
  <text x="400" y="415" font-size="10" fill="#6E6456">defer SLM synthesis while host &gt; 80%</text>
  <rect x="386" y="444" width="146" height="56" rx="8" fill="#FCFAF4" stroke="#C9BEA8"/>
  <text x="400" y="465" font-size="11.5" font-weight="600" fill="#241E1A">TTL sweeper</text>
  <text x="400" y="481" font-size="9.5" fill="#6E6456">purge both stores</text>
  <rect x="540" y="444" width="146" height="56" rx="8" fill="#FCFAF4" stroke="#C9BEA8"/>
  <text x="554" y="465" font-size="11.5" font-weight="600" fill="#241E1A">Realtime WS</text>
  <text x="554" y="481" font-size="9.5" fill="#6E6456">/ws · /ext/ws</text>

  <!-- Column C: synthesis -->
  <text x="706" y="298" font-size="10.5" font-weight="700" fill="#9a8f7d" letter-spacing="0.06em">SYNTHESIS (local model)</text>
  <rect x="706" y="304" width="328" height="64" rx="8" fill="#F0E4D4" stroke="#B4661E"/>
  <text x="720" y="326" font-size="12" font-weight="600" fill="#241E1A">Inference</text>
  <text x="720" y="343" font-size="10" fill="#6E6456">restore · restore-context (cross-app)</text>
  <text x="720" y="358" font-size="10" fill="#6E6456">daily manager report · structured JSON</text>
  <rect x="706" y="376" width="328" height="52" rx="8" fill="#FCFAF4" stroke="#C9BEA8"/>
  <text x="720" y="397" font-size="12" font-weight="600" fill="#241E1A">Deep profiler</text>
  <text x="720" y="414" font-size="10" fill="#6E6456">Start / End of Day (git · files · excerpt)</text>
  <rect x="706" y="436" width="328" height="56" rx="8" fill="#FCFAF4" stroke="#C9BEA8"/>
  <text x="720" y="457" font-size="12" font-weight="600" fill="#241E1A">Report builder → cloud sync</text>
  <text x="720" y="474" font-size="10" fill="#6E6456">aggregate day → 1-page summary</text>

  <!-- governor gate to inference -->
  <path d="M686,404 L696,404 L696,336 L704,336" fill="none" stroke="#6E6456" stroke-width="1.4" stroke-dasharray="2 3" marker-end="url(#aInk)"/>

  <!-- capture -> sanitizer -->
  <line x1="366" y1="328" x2="384" y2="332" stroke="#2C6E6A" stroke-width="1.6" marker-end="url(#aTeal)"/>
  <line x1="366" y1="386" x2="384" y2="350" stroke="#2C6E6A" stroke-width="1.6" marker-end="url(#aTeal)"/>

  <!-- endpoints line -->
  <text x="550" y="596" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#9a8f7d">/snapshot · /restore · /restore-context · /start-day · /end-day · /report/daily · /observer · /rehydrate · /search · /history · /health</text>

  <!-- ===================== STORAGE + MODELS ===================== -->
  <rect x="66" y="650" width="300" height="86" rx="10" fill="#F0E4D4" stroke="#B4661E"/>
  <text x="216" y="676" text-anchor="middle" font-size="13" font-weight="600" fill="#241E1A">SQLite — hot store</text>
  <text x="216" y="695" text-anchor="middle" font-size="10" fill="#6E6456">the restore path · event_type</text>
  <text x="216" y="711" text-anchor="middle" font-size="10" font-weight="600" fill="#B4661E">interruption buffer flag</text>

  <rect x="386" y="650" width="280" height="86" rx="10" fill="#E7E1F0" stroke="#6B4E9E"/>
  <text x="526" y="676" text-anchor="middle" font-size="13" font-weight="600" fill="#241E1A">ChromaDB — cold store</text>
  <text x="526" y="695" text-anchor="middle" font-size="10" fill="#6E6456">one vector / snapshot</text>
  <text x="526" y="711" text-anchor="middle" font-size="10" font-weight="600" fill="#6B4E9E">history search ONLY</text>

  <rect x="686" y="650" width="170" height="86" rx="10" fill="#F0E4D4" stroke="#B4661E"/>
  <text x="771" y="676" text-anchor="middle" font-size="12.5" font-weight="600" fill="#241E1A">Ollama (local)</text>
  <text x="771" y="695" text-anchor="middle" font-size="10" fill="#6E6456">deepseek-r1:1.5b</text>
  <text x="771" y="711" text-anchor="middle" font-size="10" fill="#6E6456">JSON output</text>

  <rect x="876" y="650" width="158" height="86" rx="10" fill="#E7E1F0" stroke="#6B4E9E"/>
  <text x="955" y="676" text-anchor="middle" font-size="12.5" font-weight="600" fill="#241E1A">ONNX embedder</text>
  <text x="955" y="695" text-anchor="middle" font-size="10" fill="#6E6456">all-MiniLM-L6-v2</text>
  <text x="955" y="711" text-anchor="middle" font-size="10" fill="#6E6456">no PyTorch</text>

  <!-- daemon <-> storage/model arrows -->
  <line x1="180" y1="612" x2="180" y2="650" stroke="#2C6E6A" stroke-width="1.8" marker-end="url(#aTeal)"/>
  <text x="174" y="636" text-anchor="end" font-size="9.5" fill="#2C6E6A">sanitized write</text>
  <line x1="252" y1="650" x2="252" y2="612" stroke="#B4661E" stroke-width="2" marker-end="url(#aAmber)"/>
  <text x="258" y="636" font-size="9.5" fill="#B4661E">read latest / buffer</text>

  <line x1="526" y1="612" x2="526" y2="650" stroke="#6B4E9E" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#aViolet)"/>
  <text x="532" y="636" font-size="9.5" fill="#6B4E9E">index / query</text>

  <line x1="771" y1="612" x2="771" y2="650" stroke="#B4661E" stroke-width="2" marker-end="url(#aAmber)"/>
  <text x="777" y="636" font-size="9.5" fill="#B4661E">snapshot → JSON</text>

  <line x1="666" y1="690" x2="874" y2="690" stroke="#6B4E9E" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#aViolet)"/>
  <text x="770" y="683" text-anchor="middle" font-size="9.5" fill="#6B4E9E">embeds</text>

  <!-- ===================== CLOUD (outside boundary) ===================== -->
  <rect x="1100" y="440" width="110" height="96" rx="10" fill="#FCFAF4" stroke="#C9BEA8" stroke-dasharray="5 4"/>
  <text x="1155" y="482" text-anchor="middle" font-size="12" font-weight="600" fill="#241E1A">Cloud</text>
  <text x="1155" y="500" text-anchor="middle" font-size="10" fill="#6E6456">Supabase</text>
  <text x="1155" y="516" text-anchor="middle" font-size="9.5" fill="#6E6456">manager report</text>
  <path d="M1034,464 L1070,464 L1070,488 L1098,488" fill="none" stroke="#B4661E" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aAmber)"/>
  <text x="1084" y="456" text-anchor="middle" font-size="9.5" fill="#B4661E">summary only · opt-in</text>

  <!-- footer caption -->
  <text x="40" y="892" font-size="11.5" fill="#6E6456">Two loops on one core — micro-recovery (interruption → buffer → cross-app restore → rehydrate) and macro day (start-of-day → activity → end-of-day report). Restore is a single SQL lookup; vectors stay isolated to search.</text>
</svg>
